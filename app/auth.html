<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilly — Sign in</title>
<link rel="stylesheet" href="../design/styles.css">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--tilly-grey-100); }
  .auth-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 24px 64px; }
  .auth-head { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 680px; margin-bottom: 40px; }
  .auth-card { background: var(--tilly-white); border: var(--line); width: 100%; max-width: 680px; padding: 48px; }
  .auth-card h1 { margin: 0 0 8px; }
  .stepper { display: flex; align-items: center; gap: 0; margin-bottom: 40px; }
  .step { display: flex; align-items: center; gap: 10px; }
  .step .n {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px;
    border: 1px solid var(--tilly-grey-200); color: var(--tilly-grey-500); background: var(--tilly-white);
  }
  .step.on .n { background: var(--tilly-blue); border-color: var(--tilly-blue); color: #fff; }
  .step.done .n { background: var(--tilly-black); border-color: var(--tilly-black); color: #fff; }
  .step .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; color: var(--tilly-grey-500); }
  .step.on .lbl { color: var(--tilly-black); }
  .step-line { flex: 1; height: 1px; background: var(--tilly-grey-200); margin: 0 12px; min-width: 20px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--tilly-grey-500); margin-bottom: 8px; text-transform: uppercase; }
  .field .input { width: 100%; box-sizing: border-box; }
  .field.err .input { border-color: var(--tilly-red); outline: 1px solid var(--tilly-red); }
  .field .err-msg { display: none; font-size: 12px; color: var(--tilly-red); margin-top: 6px; }
  .field.err .err-msg { display: block; }
  .field .hint { font-size: 12px; color: var(--tilly-grey-500); margin-top: 6px; }
  .checkline { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; font-size: 13px; cursor: pointer; }
  .checkline .tick { margin-top: 1px; }
  .btn-block { width: 100%; box-sizing: border-box; padding: 16px; font-size: 15px; }
  .code-row { display: flex; gap: 10px; }
  .code-row input {
    width: 56px; height: 64px; text-align: center;
    font-family: var(--font-mono); font-size: 24px;
    border: var(--line); border-radius: 0; background: var(--tilly-white);
  }
  .code-row input:focus { border-color: var(--tilly-blue); outline: 1px solid var(--tilly-blue); }
  select.input { appearance: none; -webkit-appearance: none; background: var(--tilly-white); width: 100%; box-sizing: border-box; }
  .plans { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 20px 0; }
  .plan { border: var(--line); padding: 24px 20px; cursor: pointer; position: relative; }
  .plan:hover { border-color: var(--tilly-black); }
  .plan.on { border: 2px solid var(--tilly-blue); padding: 23px 19px; }
  .plan .price { font-weight: 600; font-size: 28px; letter-spacing: -1.2px; margin: 10px 0 2px; }
  .seg { display: flex; border: var(--line); margin: 20px 0 4px; }
  .seg button { flex: 1; border: none; background: var(--tilly-white); padding: 12px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--tilly-grey-500); }
  .seg button.on { background: var(--tilly-black); color: #fff; }
  .goalline { border: var(--line); padding: 14px 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .goalline.on { border-color: var(--tilly-blue); background: var(--tilly-grey-100); }
  .welcome-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 28px; }
  .wcard { border: var(--line); padding: 36px 28px; text-align: center; }
  .wcard.rec { border: 2px solid var(--tilly-blue); }
  @media (max-width: 640px) { .plans, .welcome-cards { grid-template-columns: 1fr; } .stepper .lbl { display: none; } }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-head">
    <a href="index.html" class="wordmark" style="text-decoration:none"><div class="mark mark-28"></div><span>Tilly</span></a>
    <span class="m-data t-muted" id="head-note">THE AI SALESFORCE FOR CHARITY RETAIL</span>
  </div>
  <div class="auth-card" id="card"></div>
  <div style="margin-top:20px"><a class="m-data" href="index.html" style="color:var(--tilly-grey-500)">← BACK TO THE CRM PROTOTYPE</a></div>
</div>
<script src="data.js?v=16"></script>
<script src="auth.js?v=2"></script>
</body>
</html>
